version: '3.8'

# Meta-Orchestrator Switchboard - Docker Compose Configuration
# For local development and testing

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: switchboard-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-switchboard}
      POSTGRES_USER: ${POSTGRES_USER:-switchboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-switchboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - switchboard-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: switchboard-backend
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-switchboard}:${POSTGRES_PASSWORD:-dev_password}@db:5432/${POSTGRES_DB:-switchboard}

      # Application
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      API_VERSION: "1.0.0"

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173,http://localhost:80}

      # External Services (Optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Email Configuration (Optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

      # Slack Configuration (Optional)
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source for development (hot reload)
      - ./backend:/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - switchboard-network
    restart: unless-stopped

  # Frontend (Nginx + React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: switchboard-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - switchboard-network
    restart: unless-stopped

  # Redis (Optional - for caching and Celery)
  # redis:
  #   image: redis:7-alpine
  #   container_name: switchboard-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - switchboard-network
  #   restart: unless-stopped

  # Celery Worker (Optional - for async tasks)
  # celery-worker:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: switchboard-celery-worker
  #   command: celery -A app.celery_app worker --loglevel=info
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-switchboard}:${POSTGRES_PASSWORD:-dev_password}@db:5432/${POSTGRES_DB:-switchboard}
  #     CELERY_BROKER_URL: redis://redis:6379/0
  #     CELERY_RESULT_BACKEND: redis://redis:6379/0
  #   depends_on:
  #     - db
  #     - redis
  #   volumes:
  #     - ./backend:/app:ro
  #   networks:
  #     - switchboard-network
  #   restart: unless-stopped

networks:
  switchboard-network:
    driver: bridge
    name: switchboard-network

volumes:
  postgres_data:
    name: switchboard_postgres_data
  # redis_data:
  #   name: switchboard_redis_data
