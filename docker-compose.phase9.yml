version: '3.8'

# Meta-Orchestrator Switchboard - Phase 9 Production Configuration
# Includes advanced monitoring, caching, and real-time features

services:
  # ============================================================================
  # Core Services (from previous phases)
  # ============================================================================
  
  db:
    image: postgres:16-alpine
    container_name: switchboard-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-switchboard}
      POSTGRES_USER: ${POSTGRES_USER:-switchboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-switchboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - switchboard-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: switchboard-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-switchboard}:${POSTGRES_PASSWORD:-dev_password}@db:5432/${POSTGRES_DB:-switchboard}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - switchboard-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: switchboard-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - switchboard-network
    restart: unless-stopped

  # ============================================================================
  # Phase 9: Redis Cache & Session Store
  # ============================================================================
  
  redis:
    image: redis:7-alpine
    container_name: switchboard-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - switchboard-network
    restart: unless-stopped

  # ============================================================================
  # Phase 9: Celery Background Workers
  # ============================================================================
  
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: switchboard-celery-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-switchboard}:${POSTGRES_PASSWORD:-dev_password}@db:5432/${POSTGRES_DB:-switchboard}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - db
      - redis
    networks:
      - switchboard-network
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: switchboard-celery-beat
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-switchboard}:${POSTGRES_PASSWORD:-dev_password}@db:5432/${POSTGRES_DB:-switchboard}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      - db
      - redis
    networks:
      - switchboard-network
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: switchboard-flower
    command: celery -A app.celery_app flower --port=5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery-worker
    networks:
      - switchboard-network
    restart: unless-stopped

  # ============================================================================
  # Phase 9: Monitoring Stack
  # ============================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: switchboard-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - switchboard-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: switchboard-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - switchboard-network
    restart: unless-stopped

  # ============================================================================
  # Phase 9: Distributed Tracing (Jaeger)
  # ============================================================================
  
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: switchboard-jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "5775:5775/udp"  # Zipkin compact
      - "6831:6831/udp"  # Jaeger compact
      - "6832:6832/udp"  # Jaeger binary
      - "5778:5778"      # Serve configs
      - "16686:16686"    # Web UI
      - "14268:14268"    # Jaeger collector
      - "14250:14250"    # gRPC
      - "9411:9411"      # Zipkin
    networks:
      - switchboard-network
    restart: unless-stopped

  # ============================================================================
  # Phase 9: Exporters for Monitoring
  # ============================================================================
  
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: switchboard-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-switchboard}:${POSTGRES_PASSWORD:-dev_password}@db:5432/${POSTGRES_DB:-switchboard}?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - db
    networks:
      - switchboard-network
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: switchboard-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - switchboard-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: switchboard-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - switchboard-network
    restart: unless-stopped

networks:
  switchboard-network:
    driver: bridge
    name: switchboard-network

volumes:
  postgres_data:
    name: switchboard_postgres_data
  redis_data:
    name: switchboard_redis_data
  prometheus_data:
    name: switchboard_prometheus_data
  grafana_data:
    name: switchboard_grafana_data
