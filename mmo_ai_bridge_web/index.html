<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMO AI Bridge v1.0 - Production Release</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="animations.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            position: relative;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header .version {
            font-size: 1.2em;
            opacity: 0.8;
        }

        .connection-status {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            padding: 8px 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #44ff44;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .toolbar button {
            flex: 1;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toolbar button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .toolbar button.active {
            background: #44ff44;
            color: #333;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr 300px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .panel h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }

        button.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #characters-container {
            min-height: 500px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            overflow-y: auto;
            max-height: 700px;
        }

        .character-card {
            background: white;
            border-left: 5px solid #667eea;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s;
            animation: slideIn 0.3s ease-out;
            cursor: pointer;
            position: relative;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .character-card:hover {
            transform: translateX(5px) scale(1.02);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .character-card.training {
            border-left-color: #ffc107;
            animation: training-glow 2s infinite;
        }

        @keyframes training-glow {
            0%, 100% { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
            50% { box-shadow: 0 2px 20px rgba(255, 193, 7, 0.5); }
        }

        .character-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .character-icon {
            font-size: 2.5em;
        }

        .character-info {
            flex: 1;
        }

        .character-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .character-class {
            color: #667eea;
            font-size: 0.9em;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin-left: 10px;
        }

        .status-badge.training {
            background: #ffc107;
            color: #333;
        }

        .status-badge.active {
            background: #4caf50;
            color: white;
        }

        .status-badge.idle {
            background: #9e9e9e;
            color: white;
        }

        .health-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            position: relative;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50 0%, #8bc34a 100%);
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .health-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8em;
            font-weight: bold;
            color: #333;
        }

        .metrics {
            margin-top: 10px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .metric {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9em;
            padding: 5px 10px;
            background: #f0f0f0;
            border-radius: 5px;
        }

        .metric-label {
            font-weight: bold;
            color: #666;
        }

        .metric-value {
            color: #667eea;
            font-weight: bold;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            color: #333;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 2em;
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #333;
        }

        /* Settings Panel */
        #settings-panel {
            grid-column: 3;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .setting-group input[type="range"] {
            width: 100%;
        }

        .setting-group input[type="color"] {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .setting-group select {
            width: 100%;
            padding: 8px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 14px;
        }

        /* Animation Controls */
        .animation-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .animation-controls button {
            flex: 1;
            padding: 8px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .animation-controls button:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .animation-controls button.active {
            background: #4caf50;
        }

        /* Quick Examples */
        .quick-examples {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .example-btn {
            padding: 10px;
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .example-btn:hover {
            background: rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        /* Loading Spinner */
        .loading-spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        .loading-spinner.active {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 25px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            margin: 10px 0;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            #settings-panel {
                grid-column: 1;
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            .toolbar {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 MMO AI Bridge</h1>
            <p class="version">Version 1.0 - Production Release 🎉</p>
            <div class="connection-status">
                <div class="status-indicator" id="connection-indicator"></div>
                <span id="connection-text">Connecting...</span>
            </div>
        </header>

        <div class="toolbar">
            <button onclick="startTrainingSimulation()">▶️ Start Training</button>
            <button onclick="stopSimulation()">⏹️ Stop</button>
            <button onclick="exportScene()">📸 Export Scene</button>
            <button onclick="window.location.href='stats.html'">📊 Statistics</button>
            <button onclick="clearCharacters()">🗑️ Clear All</button>
        </div>

        <div class="main-grid">
            <div class="panel" id="input-panel">
                <h2>📝 Input</h2>
                <textarea id="ai-text-input" placeholder="Describe your AI/ML workflow...&#10;&#10;Example:&#10;Training a Random Forest classifier with 100 trees..."></textarea>
                <button class="primary" onclick="translateText()">Translate to MMO</button>

                <div class="quick-examples">
                    <button class="example-btn" onclick="loadExample(1)">Random Forest</button>
                    <button class="example-btn" onclick="loadExample(2)">CNN Training</button>
                    <button class="example-btn" onclick="loadExample(3)">BERT Fine-tuning</button>
                    <button class="example-btn" onclick="loadExample(4)">ML Pipeline</button>
                </div>

                <div id="scene-description" style="margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; display: none;">
                    <h3 style="color: #667eea; margin-bottom: 10px;">Scene Description</h3>
                    <p id="scene-text" style="color: #555;"></p>
                </div>
            </div>

            <div class="panel" id="visualization-panel">
                <h2>🎨 Visualization</h2>
                <div id="training-progress" style="display: none;">
                    <h3 style="color: #667eea; margin-bottom: 10px;">Training Progress</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%;">0%</div>
                    </div>
                    <p id="training-status" style="margin-top: 10px; color: #555;"></p>
                </div>
                <div class="loading-spinner" id="loading-spinner"></div>
                <div id="characters-container">
                    <p style="text-align: center; color: #999; margin-top: 100px;">No characters yet. Enter AI text to visualize!</p>
                </div>
            </div>

            <div class="panel" id="settings-panel">
                <h2>⚙️ Settings</h2>

                <div class="setting-group">
                    <label>Animation Speed</label>
                    <input type="range" id="animation-speed" min="0.5" max="3" step="0.5" value="1">
                    <p style="text-align: center; color: #555;"><span id="speed-value">1.0</span>x</p>
                </div>

                <div class="setting-group">
                    <label>Training Epochs</label>
                    <input type="range" id="training-epochs" min="5" max="50" step="5" value="10">
                    <p style="text-align: center; color: #555;"><span id="epochs-value">10</span> epochs</p>
                </div>

                <div class="setting-group">
                    <label>Theme Color</label>
                    <input type="color" id="theme-color" value="#667eea" onchange="updateTheme()">
                </div>

                <div class="setting-group">
                    <label>Sort Characters By</label>
                    <select id="sort-order" onchange="sortCharacters()">
                        <option value="default">Default</option>
                        <option value="health">Health</option>
                        <option value="level">Level</option>
                        <option value="name">Name</option>
                    </select>
                </div>

                <div class="animation-controls">
                    <button onclick="toggleAnimations()" id="animation-toggle">⏸️ Pause</button>
                    <button onclick="resetView()">🔄 Reset</button>
                </div>

                <div style="margin-top: 20px; padding: 15px; background: rgba(102, 126, 234, 0.1); border-radius: 8px;">
                    <h3 style="color: #667eea; margin-bottom: 10px;">Stats</h3>
                    <p style="color: #555;"><strong>Active Characters:</strong> <span id="active-count">0</span></p>
                    <p style="color: #555;"><strong>Total Sessions:</strong> <span id="session-count">0</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Character Detail Modal -->
    <div class="modal" id="character-modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2 id="modal-character-name">Character Details</h2>
            <div id="modal-character-details"></div>
        </div>
    </div>

    <script>
        // ========================================
        // WebSocket Connection
        // ========================================
        const socket = io('http://localhost:5000');

        socket.on('connect', () => {
            console.log('Connected to server');
            document.getElementById('connection-indicator').classList.add('connected');
            document.getElementById('connection-text').textContent = 'Connected';
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            document.getElementById('connection-indicator').classList.remove('connected');
            document.getElementById('connection-text').textContent = 'Disconnected';
        });

        socket.on('connection_response', (data) => {
            console.log('Server:', data.message);
        });

        socket.on('training_update', (data) => {
            updateTrainingProgress(data);
            updateCharacterInPlace(data);
        });

        socket.on('training_complete', (data) => {
            hideTrainingProgress();
            console.log('Training complete:', data.message);
            setTimeout(() => {
                alert(`✅ ${data.message}\n\nFinal Accuracy: ${data.final_accuracy}`);
            }, 500);
        });

        socket.on('simulation_started', (data) => {
            console.log('Simulation started:', data.message);
            showTrainingProgress();
        });

        socket.on('simulation_stopped', (data) => {
            console.log('Simulation stopped:', data.message);
            hideTrainingProgress();
        });

        // ========================================
        // Global State
        // ========================================
        let characters = [];
        let animationsPaused = false;
        let sessionCount = 0;

        // ========================================
        // Main Functions
        // ========================================
        async function translateText() {
            const text = document.getElementById('ai-text-input').value.trim();
            if (!text) {
                alert('Please enter some AI text to translate!');
                return;
            }

            showLoading();

            try {
                const response = await fetch('http://localhost:5000/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (data.error) {
                    alert('Error: ' + data.error);
                    hideLoading();
                    return;
                }

                characters = data.characters;
                displayCharacters(characters);
                displaySceneDescription(data.scene_description);
                hideLoading();
                sessionCount++;
                updateStats();

            } catch (error) {
                console.error('Error:', error);
                alert('Failed to connect to server. Make sure the server is running on port 5000.');
                hideLoading();
            }
        }

        function displayCharacters(chars) {
            const container = document.getElementById('characters-container');
            container.innerHTML = '';

            chars.forEach((char, index) => {
                const card = createCharacterCard(char, index);
                container.appendChild(card);
            });
        }

        function createCharacterCard(char, index) {
            const card = document.createElement('div');
            card.className = 'character-card';
            card.dataset.index = index;
            if (char.status === 'training') {
                card.classList.add('training');
            }

            const icon = getClassIcon(char.class);
            const healthPercent = (char.health / (char.max_health || 100)) * 100;

            card.innerHTML = `
                <div class="character-header">
                    <div class="character-icon">${icon}</div>
                    <div class="character-info">
                        <div class="character-name">${char.name}</div>
                        <div class="character-class">${char.class} | Level ${char.level}</div>
                    </div>
                    <span class="status-badge ${char.status}">${char.status}</span>
                </div>
                <div class="health-bar">
                    <div class="health-fill" style="width: ${healthPercent}%"></div>
                    <div class="health-text">${char.health}/${char.max_health || 100} HP</div>
                </div>
                <div class="metrics">
                    ${Object.entries(char.metrics || {}).map(([key, value]) => `
                        <div class="metric">
                            <span class="metric-label">${key}:</span>
                            <span class="metric-value">${typeof value === 'number' ? value.toFixed(3) : value}</span>
                        </div>
                    `).join('')}
                </div>
            `;

            card.onclick = () => showCharacterDetails(char, index);

            return card;
        }

        function showCharacterDetails(char, index) {
            const modal = document.getElementById('character-modal');
            const modalName = document.getElementById('modal-character-name');
            const modalDetails = document.getElementById('modal-character-details');

            modalName.textContent = `${char.name} - ${char.class}`;

            modalDetails.innerHTML = `
                <div style="margin-top: 20px;">
                    <h3 style="color: #667eea;">Character Stats</h3>
                    <table style="width: 100%; margin-top: 10px; border-collapse: collapse;">
                        <tr><td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>Level:</strong></td><td style="padding: 8px; border-bottom: 1px solid #eee;">${char.level}</td></tr>
                        <tr><td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>Health:</strong></td><td style="padding: 8px; border-bottom: 1px solid #eee;">${char.health}/${char.max_health || 100}</td></tr>
                        <tr><td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>Mana:</strong></td><td style="padding: 8px; border-bottom: 1px solid #eee;">${char.mana || 100}</td></tr>
                        <tr><td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>Experience:</strong></td><td style="padding: 8px; border-bottom: 1px solid #eee;">${char.experience || 0}</td></tr>
                        <tr><td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>Status:</strong></td><td style="padding: 8px; border-bottom: 1px solid #eee;">${char.status}</td></tr>
                        <tr><td style="padding: 8px; border-bottom: 1px solid #eee;"><strong>Position:</strong></td><td style="padding: 8px; border-bottom: 1px solid #eee;">(${char.x}, ${char.y})</td></tr>
                    </table>

                    <h3 style="color: #667eea; margin-top: 20px;">Metrics</h3>
                    <div style="margin-top: 10px;">
                        ${Object.entries(char.metrics || {}).map(([key, value]) => `
                            <div style="margin-bottom: 8px; padding: 10px; background: #f0f0f0; border-radius: 5px;">
                                <strong>${key}:</strong> ${typeof value === 'number' ? value.toFixed(4) : value}
                            </div>
                        `).join('')}
                    </div>

                    <div style="margin-top: 20px;">
                        <button class="primary" onclick="startCharacterTraining(${index})">Start Training</button>
                    </div>
                </div>
            `;

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('character-modal').classList.remove('active');
        }

        function startCharacterTraining(index) {
            closeModal();
            if (characters[index]) {
                const char = characters[index];
                const epochs = parseInt(document.getElementById('training-epochs').value);
                const speed = parseFloat(document.getElementById('animation-speed').value);

                socket.emit('start_training_simulation', {
                    model_name: char.name,
                    epochs: epochs,
                    speed: speed
                });
            }
        }

        function startTrainingSimulation() {
            if (characters.length === 0) {
                alert('No characters to train! Create some characters first.');
                return;
            }

            const epochs = parseInt(document.getElementById('training-epochs').value);
            const speed = parseFloat(document.getElementById('animation-speed').value);

            socket.emit('start_training_simulation', {
                model_name: characters[0].name,
                epochs: epochs,
                speed: speed
            });
        }

        function stopSimulation() {
            socket.emit('stop_simulation');
        }

        function updateTrainingProgress(data) {
            const progressFill = document.getElementById('progress-fill');
            const trainingStatus = document.getElementById('training-status');

            const percent = Math.round(data.progress * 100);
            progressFill.style.width = percent + '%';
            progressFill.textContent = percent + '%';

            trainingStatus.textContent = `Training ${data.model_name}: Epoch ${data.epoch}/${data.total_epochs} | Accuracy: ${data.metrics.accuracy} | Loss: ${data.metrics.loss}`;
        }

        function updateCharacterInPlace(data) {
            const card = document.querySelector(`[data-index="0"]`);
            if (!card) return;

            const healthFill = card.querySelector('.health-fill');
            const healthText = card.querySelector('.health-text');
            const statusBadge = card.querySelector('.status-badge');

            if (healthFill && healthText) {
                const healthPercent = data.health;
                healthFill.style.width = healthPercent + '%';
                healthText.textContent = `${data.health}/${characters[0].max_health || 100} HP`;
            }

            if (statusBadge) {
                statusBadge.textContent = data.status;
                statusBadge.className = 'status-badge ' + data.status;
            }

            // Update metrics
            const metricsDiv = card.querySelector('.metrics');
            if (metricsDiv && data.metrics) {
                metricsDiv.innerHTML = Object.entries(data.metrics).map(([key, value]) => `
                    <div class="metric">
                        <span class="metric-label">${key}:</span>
                        <span class="metric-value">${typeof value === 'number' ? value.toFixed(3) : value}</span>
                    </div>
                `).join('');
            }
        }

        function showTrainingProgress() {
            document.getElementById('training-progress').style.display = 'block';
        }

        function hideTrainingProgress() {
            document.getElementById('training-progress').style.display = 'none';
        }

        function displaySceneDescription(description) {
            const sceneDiv = document.getElementById('scene-description');
            const sceneText = document.getElementById('scene-text');
            sceneText.textContent = description;
            sceneDiv.style.display = 'block';
        }

        async function exportScene() {
            const container = document.getElementById('characters-container');

            try {
                const canvas = await html2canvas(container, {
                    backgroundColor: '#f8f9fa',
                    scale: 2
                });

                const link = document.createElement('a');
                link.download = `mmo-ai-bridge-scene-${Date.now()}.png`;
                link.href = canvas.toDataURL();
                link.click();

                alert('✅ Scene exported successfully!');
            } catch (error) {
                console.error('Export failed:', error);
                alert('Failed to export scene. Make sure html2canvas is loaded.');
            }
        }

        function clearCharacters() {
            if (confirm('Clear all characters?')) {
                characters = [];
                document.getElementById('characters-container').innerHTML = '<p style="text-align: center; color: #999; margin-top: 100px;">No characters yet. Enter AI text to visualize!</p>';
                document.getElementById('scene-description').style.display = 'none';
                updateStats();
            }
        }

        function toggleAnimations() {
            animationsPaused = !animationsPaused;
            const btn = document.getElementById('animation-toggle');

            if (animationsPaused) {
                btn.textContent = '▶️ Play';
                document.querySelectorAll('.character-card').forEach(card => {
                    card.style.animationPlayState = 'paused';
                });
            } else {
                btn.textContent = '⏸️ Pause';
                document.querySelectorAll('.character-card').forEach(card => {
                    card.style.animationPlayState = 'running';
                });
            }
        }

        function resetView() {
            document.getElementById('animation-speed').value = 1;
            document.getElementById('training-epochs').value = 10;
            document.getElementById('theme-color').value = '#667eea';
            document.getElementById('sort-order').value = 'default';
            updateSpeedValue();
            updateEpochsValue();
            updateTheme();
            sortCharacters();
        }

        function sortCharacters() {
            const sortBy = document.getElementById('sort-order').value;

            if (sortBy === 'default') {
                displayCharacters(characters);
                return;
            }

            const sorted = [...characters].sort((a, b) => {
                switch(sortBy) {
                    case 'health': return b.health - a.health;
                    case 'level': return b.level - a.level;
                    case 'name': return a.name.localeCompare(b.name);
                    default: return 0;
                }
            });

            displayCharacters(sorted);
        }

        function updateTheme() {
            const color = document.getElementById('theme-color').value;
            document.documentElement.style.setProperty('--primary-color', color);
            // Update various elements with new theme color
            document.querySelectorAll('.panel h2').forEach(el => {
                el.style.color = color;
            });
        }

        function updateStats() {
            document.getElementById('active-count').textContent = characters.length;
            document.getElementById('session-count').textContent = sessionCount;
        }

        function loadExample(num) {
            const examples = {
                1: "Training a Random Forest classifier with 100 trees on customer churn dataset. Achieved 95% accuracy after hyperparameter tuning.",
                2: "Implementing a Convolutional Neural Network for image classification. Using transfer learning with ResNet-50 as base model.",
                3: "Fine-tuning BERT model for sentiment analysis on movie reviews. Training for 5 epochs with learning rate 2e-5.",
                4: "Building complete ML pipeline: data collection → preprocessing → feature engineering → model training → validation → deployment."
            };
            document.getElementById('ai-text-input').value = examples[num];
        }

        function getClassIcon(className) {
            const icons = {
                'Warrior': '⚔️',
                'Mage': '🧙',
                'Druid': '🌳',
                'Alchemist': '⚗️',
                'Rogue': '🗡️',
                'Bard': '🎵',
                'Necromancer': '💀',
                'Paladin': '🛡️',
                'Artificer': '🔧'
            };
            return icons[className] || '🎮';
        }

        function showLoading() {
            document.getElementById('loading-spinner').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loading-spinner').classList.remove('active');
        }

        // ========================================
        // Event Listeners
        // ========================================
        document.getElementById('animation-speed').addEventListener('input', updateSpeedValue);
        document.getElementById('training-epochs').addEventListener('input', updateEpochsValue);

        function updateSpeedValue() {
            document.getElementById('speed-value').textContent = document.getElementById('animation-speed').value;
        }

        function updateEpochsValue() {
            document.getElementById('epochs-value').textContent = document.getElementById('training-epochs').value;
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('character-modal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Initialize
        updateStats();
    </script>
</body>
</html>
